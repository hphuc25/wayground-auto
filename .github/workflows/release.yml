name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v4.0.1); created when it does not exist"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$TAG' does not look like vX.Y.Z" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # One-file desktop/CLI binary built on Ubuntu 22.04 (glibc 2.35), so the
  # result also runs on older distributions.
  linux-binary:
    runs-on: ubuntu-22.04
    needs: [version]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt/X11 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxi6 libsm6 libice6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build the standalone binary
        run: python scripts/build_linux.py --distpath dist-ci

      - name: Package and checksum
        run: |
          tar -C dist-ci -czf "WaygroundAutomator-${{ needs.version.outputs.tag }}-linux-x86_64.tar.gz" WaygroundAutomator
          sha256sum "WaygroundAutomator-${{ needs.version.outputs.tag }}-linux-x86_64.tar.gz" > binary.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: |
            WaygroundAutomator-*.tar.gz
            binary.sha256

  # System package built from packaging/arch/PKGBUILD on a clean Arch Linux.
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools and dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git python pyside6 python-playwright python-openai

      - name: Create unprivileged builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/build
          chown -R builder /home/builder/build

      - name: Build the Arch package
        run: su builder -c "cd /home/builder/build/packaging/arch && makepkg -f --noconfirm"

      - name: Generate the prebuilt-variant PKGBUILD
        run: |
          cp /home/builder/build/packaging/arch/*.pkg.tar.zst .
          ASSET="$(ls wayground-pro-automator-*.pkg.tar.zst)"
          VERSION="$(echo "$ASSET" | sed -E 's/^wayground-pro-automator-(.+)-([0-9]+)-x86_64\.pkg\.tar\.zst$/\1/')"
          RELEASE="$(echo "$ASSET" | sed -E 's/^wayground-pro-automator-(.+)-([0-9]+)-x86_64\.pkg\.tar\.zst$/\2/')"
          SHA256="$(sha256sum "$ASSET" | awk '{print $1}')"
          mkdir -p bin-pkgbuild
          sed -e "s/__PKGVER__/$VERSION/g" \
              -e "s/__PKGREL__/$RELEASE/g" \
              -e "s/__ASSET__/$ASSET/g" \
              -e "s/__SHA256__/$SHA256/g" \
              -e "s/__TAG__/${{ needs.version.outputs.tag }}/g" \
              packaging/arch-bin/PKGBUILD > bin-pkgbuild/PKGBUILD
          cd bin-pkgbuild && makepkg --printsrcinfo > .SRCINFO
          cat .SRCINFO

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            wayground-pro-automator-*.pkg.tar.zst
            bin-pkgbuild/PKGBUILD
            bin-pkgbuild/.SRCINFO

  release:
    runs-on: ubuntu-22.04
    needs: [version, linux-binary, arch-package]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s globstar nullglob
          FILES=(artifacts/**/*)
          gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Wayground Pro Automator $TAG" --generate-notes || true
          gh release upload "$TAG" "${FILES[@]}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
